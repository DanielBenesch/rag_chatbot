[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Agentic RAG chatbot for a fictional e-bike manufacturer"
authors = [
    { name = "Daniel Benesch", email = "daniel.benesch95@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "mlflow>=3.17.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "streamlit>=1.65.0",
]

[project.scripts]
ingest = "rag_chatbot.ingest:main"
evaluate = "rag_chatbot.evaluate:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
